---
name: Release

'on':
  push:
    branches:
      - main

concurrency:
  group: servitium-gitops-promotion
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out the release revision
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install locked dependencies
        run: npm ci

      - name: Run canonical validation
        run: bash scripts/validate

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      guard: ${{ steps.guard.outputs.content }}
    steps:
      - name: Check out Servitium
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up the attestation-capable Buildx driver
        # docker/setup-buildx-action v3
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish immutable image
        id: build
        env:
          IMAGE: ghcr.io/hannosirkel/servitium
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/build-metadata.json"
          docker buildx build --platform linux/amd64 \
            --provenance=mode=min --sbom=true \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" --push \
            --metadata-file "$metadata" .
          digest="$(jq -er '."containerimage.digest"' "$metadata")"
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Scan the published immutable digest
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/hannosirkel/servitium@${{ steps.build.outputs.digest }}
          format: json
          output: trivy-results.json
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          scanners: vuln
          version: v0.70.0

      - name: Retain the vulnerability report
        if: ${{ always() && hashFiles('trivy-results.json') != '' }}
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-live-${{ github.sha }}
          path: trivy-results.json
          if-no-files-found: error
          retention-days: 7

      - name: Transfer the reviewed digest guard
        id: guard
        run: |
          set -euo pipefail
          content="$(base64 --wrap=0 scripts/update-gitops-digest.sh)"
          echo "content=$content" >>"$GITHUB_OUTPUT"

  promote:
    needs: publish
    runs-on: ubuntu-24.04
    environment: live
    permissions: {}
    env:
      APP_CLIENT_ID: ${{ secrets.SERVITIUM_DEPLOYER_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.SERVITIUM_DEPLOYER_PRIVATE_KEY }}
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - name: Mint repository-scoped GitHub App token
        id: app-token
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/servitium-deployer.pem"
          trap 'rm -f -- "$key"' EXIT
          printf '%s' "$APP_PRIVATE_KEY" >"$key"

          b64url() {
            openssl base64 -A | tr '+/' '-_' | tr -d '='
          }
          now="$(date +%s)"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)"
          payload="$(jq -cn --arg iss "$APP_CLIENT_ID" \
            --argjson iat "$((now - 60))" --argjson exp "$((now + 540))" \
            '{iat:$iat,exp:$exp,iss:$iss}' | b64url)"
          unsigned="${header}.${payload}"
          signature="$(printf '%s' "$unsigned" \
            | openssl dgst -sha256 -sign "$key" -binary | b64url)"
          jwt="${unsigned}.${signature}"
          github_api=https://api.github.com
          repository=hannosirkel/servitium-main

          installation_id="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $jwt" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${github_api}/repos/${repository}/installation" \
            | jq -er '.id')"
          token="$(curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $jwt" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data '{"repositories":["servitium-main"]}' \
            "${github_api}/app/installations/${installation_id}/access_tokens" \
            | jq -er '.token')"
          echo "::add-mask::$token"
          echo "token=$token" >>"$GITHUB_OUTPUT"

      - name: Check out only Servitium GitOps state
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hannosirkel/servitium-main
          token: ${{ steps.app-token.outputs.token }}
          path: gitops
          persist-credentials: false

      - name: Apply the exact image digest update
        env:
          GUARD_CONTENT: ${{ needs.publish.outputs.guard }}
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/update-gitops-digest.sh"
          printf '%s' "$GUARD_CONTENT" | base64 --decode >"$guard"
          chmod 0700 "$guard"
          "$guard" "$IMAGE_DIGEST" "$GITHUB_WORKSPACE/gitops/overlays/live"

      - name: Commit and push the GitOps update
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        working-directory: gitops
        run: |
          set -euo pipefail
          git config user.name 'servitium-deployer[bot]'
          git config user.email \
            'servitium-deployer[bot]@users.noreply.github.com'
          bash tests/manifests.sh
          kubectl kustomize overlays/live >/dev/null
          kubectl kustomize overlays/test >/dev/null
          git diff --check
          git add overlays/live/kustomization.yaml
          git diff --cached --name-only | grep -qx 'overlays/live/kustomization.yaml'
          git diff --cached --check
          git commit -m "deploy(live): ${GITHUB_SHA} ${IMAGE_DIGEST}"
          git push "https://x-access-token:${APP_TOKEN}@github.com/hannosirkel/servitium-main.git" \
            HEAD:main
