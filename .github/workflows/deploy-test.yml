---
name: Deploy Test

'on':
  pull_request_target:
    branches:
      - main
    types: [labeled]

concurrency:
  group: servitium-gitops-promotion
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event.label.name == 'deploy-test' &&
      github.event.pull_request.state == 'open'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      guard: ${{ steps.verify.outputs.guard }}
      head_sha: ${{ steps.verify.outputs.head_sha }}
      pr_number: ${{ steps.verify.outputs.pr_number }}
    steps:
      - name: Verify trusted pull request metadata and validation
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api='https://api.github.com'
          headers=(
            --header "Authorization: Bearer $GITHUB_TOKEN"
            --header 'Accept: application/vnd.github+json'
            --header 'X-GitHub-Api-Version: 2022-11-28'
          )

          printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$PR_NUMBER" | grep -Eq '^[1-9][0-9]*$'
          [ "$BASE_REF" = main ]
          [ "$HEAD_REPOSITORY" = "$REPOSITORY" ]

          pull_request="$(curl --fail --silent --show-error "${headers[@]}" \
            "${api}/repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e --arg base_sha "$BASE_SHA" --arg head_sha "$HEAD_SHA" \
            --arg repository "$REPOSITORY" '
            .state == "open" and
            .base.ref == "main" and
            .base.sha == $base_sha and
            .head.repo.full_name == $repository and
            .head.sha == $head_sha
          ' >/dev/null <<<"$pull_request"

          guard_response="$(curl --fail --silent --show-error "${headers[@]}" \
            "${api}/repos/${REPOSITORY}/contents/scripts/update-gitops-digest.sh?ref=${BASE_SHA}")"
          jq -e '
            .type == "file" and
            .encoding == "base64" and
            (.content | type == "string")
          ' >/dev/null <<<"$guard_response"
          guard="$RUNNER_TEMP/update-gitops-digest.sh"
          trap 'rm -f -- "$guard"' EXIT
          jq -er '.content | gsub("\\n"; "")' <<<"$guard_response" \
            | base64 --decode >"$guard"
          grep -qx '#!/bin/sh' "$guard"
          guard_content="$(base64 --wrap=0 "$guard")"

          for _ in $(seq 1 30); do
            runs="$(curl --fail --silent --show-error "${headers[@]}" \
              "${api}/repos/${REPOSITORY}/actions/runs?event=pull_request&status=completed&head_sha=${HEAD_SHA}&per_page=100")"
            conclusion="$(jq -er --arg head_sha "$HEAD_SHA" '
              [.workflow_runs[] |
                select(.name == "Validate" and .head_sha == $head_sha and .status == "completed") |
                .conclusion
              ] | first // empty
            ' <<<"$runs" || true)"
            if [ -n "$conclusion" ]; then
              [ "$conclusion" = success ]
              break
            fi
            sleep 10
          done
          [ -n "${conclusion:-}" ]

          echo "head_sha=$HEAD_SHA" >>"$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >>"$GITHUB_OUTPUT"
          echo "guard=$guard_content" >>"$GITHUB_OUTPUT"

  build:
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
      PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
    steps:
      - name: Check out the validated revision
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.gate.outputs.head_sha }}
          persist-credentials: false

      - name: Set up the attestation-capable Buildx driver
        # docker/setup-buildx-action v3
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish the validated revision
        id: build
        env:
          IMAGE: ghcr.io/hannosirkel/servitium
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/build-metadata.json"
          docker buildx build --platform linux/amd64 \
            --provenance=mode=min --sbom=true \
            --tag "${IMAGE}:pr-${PR_NUMBER}-sha-${HEAD_SHA}" \
            --push --metadata-file "$metadata" .
          digest="$(jq -er '."containerimage.digest"' "$metadata")"
          printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Scan the published immutable digest
        # aquasecurity/trivy-action v0.36.0
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/hannosirkel/servitium@${{ steps.build.outputs.digest }}
          format: json
          output: trivy-results.json
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          scanners: vuln
          version: v0.70.0

      - name: Retain the vulnerability report
        if: ${{ always() && hashFiles('trivy-results.json') != '' }}
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trivy-test-${{ needs.gate.outputs.head_sha }}
          path: trivy-results.json
          if-no-files-found: error
          retention-days: 7

  recheck:
    needs: [gate, build]
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
      PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Verify the pull request remains promotable
        run: |
          set -euo pipefail
          pull_request="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPOSITORY}/pulls/${PR_NUMBER}")"
          jq -e --arg repository "$REPOSITORY" --arg head_sha "$HEAD_SHA" '
            .state == "open" and
            .head.repo.full_name == $repository and
            .head.sha == $head_sha and
            any(.labels[]; .name == "deploy-test")
          ' >/dev/null <<<"$pull_request"

  promote:
    needs: [gate, build, recheck]
    runs-on: ubuntu-24.04
    environment: test
    permissions: {}
    env:
      HEAD_SHA: ${{ needs.gate.outputs.head_sha }}
      IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
      PR_NUMBER: ${{ needs.gate.outputs.pr_number }}
    steps:
      - name: Mint repository-scoped GitHub App token
        id: app-token
        env:
          APP_CLIENT_ID: ${{ secrets.SERVITIUM_DEPLOYER_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.SERVITIUM_DEPLOYER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/servitium-deployer.pem"
          trap 'rm -f -- "$key"' EXIT
          printf '%s' "$APP_PRIVATE_KEY" >"$key"

          b64url() {
            openssl base64 -A | tr '+/' '-_' | tr -d '='
          }
          now="$(date +%s)"
          header="$(printf '%s' '{"alg":"RS256","typ":"JWT"}' | b64url)"
          payload="$(jq -cn --arg iss "$APP_CLIENT_ID" \
            --argjson iat "$((now - 60))" --argjson exp "$((now + 540))" \
            '{iat:$iat,exp:$exp,iss:$iss}' | b64url)"
          unsigned="${header}.${payload}"
          signature="$(printf '%s' "$unsigned" \
            | openssl dgst -sha256 -sign "$key" -binary | b64url)"
          jwt="${unsigned}.${signature}"
          github_api=https://api.github.com
          repository=hannosirkel/servitium-main

          installation_id="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $jwt" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "${github_api}/repos/${repository}/installation" \
            | jq -er '.id')"
          token="$(curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $jwt" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --header 'Content-Type: application/json' \
            --data '{"repositories":["servitium-main"]}' \
            "${github_api}/app/installations/${installation_id}/access_tokens" \
            | jq -er '.token')"
          echo "::add-mask::$token"
          echo "token=$token" >>"$GITHUB_OUTPUT"

      - name: Check out only Servitium GitOps state
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hannosirkel/servitium-main
          token: ${{ steps.app-token.outputs.token }}
          path: gitops
          persist-credentials: false

      - name: Apply the exact test image digest update
        env:
          GUARD_CONTENT: ${{ needs.gate.outputs.guard }}
        run: |
          set -euo pipefail
          guard="$RUNNER_TEMP/update-gitops-digest.sh"
          printf '%s' "$GUARD_CONTENT" | base64 --decode >"$guard"
          chmod 0700 "$guard"
          "$guard" "$IMAGE_DIGEST" "$GITHUB_WORKSPACE/gitops/overlays/test"

      - name: Commit and push the GitOps update
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        working-directory: gitops
        run: |
          set -euo pipefail
          git config user.name 'servitium-deployer[bot]'
          git config user.email \
            'servitium-deployer[bot]@users.noreply.github.com'
          bash tests/manifests.sh
          kubectl kustomize overlays/live >/dev/null
          kubectl kustomize overlays/test >/dev/null
          git diff --check
          git add overlays/test/kustomization.yaml
          git diff --cached --name-only | grep -qx 'overlays/test/kustomization.yaml'
          git diff --cached --check
          git commit -m \
            "deploy(test): PR #${PR_NUMBER} ${HEAD_SHA} ${IMAGE_DIGEST}"
          git push "https://x-access-token:${APP_TOKEN}@github.com/hannosirkel/servitium-main.git" \
            HEAD:main
